<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>Hand Window Mover</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="setup">
    <form id="setup-form">
      <h1>세션 정보</h1>
      <label>참가자 ID
        <input name="participant" required pattern="P\d{3}" placeholder="P001" title="P + 숫자 3자리 (예: P001)" autofocus />
      </label>
      <label>세션 번호
        <input name="session" type="number" required min="1" step="1" placeholder="1" />
      </label>
      <fieldset>
        <legend>손</legend>
        <label><input type="radio" name="hand" value="Left" required /> 좌</label>
        <label><input type="radio" name="hand" value="Right" /> 우</label>
      </fieldset>
      <button type="submit">시작</button>
    </form>
  </div>
  <div id="main">
    <div id="left">
      <div id="view">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
        <div id="fps">-- FPS</div>
      </div>
      <div id="bar">
        <span id="state">로딩 중…</span>
        <span>
          <button id="pip">PiP</button>
          <button id="pause">일시정지</button>
        </span>
      </div>
      <div id="who"></div>
      <div id="warn" hidden>
        ⚠️ 손쉬운 사용 권한이 없어 커서를 움직일 수 없어요.<br />
        시스템 설정 → 개인정보 보호 및 보안 → 손쉬운 사용에서 켠 뒤 앱을 다시 실행하세요.
      </div>
    </div>
    <div id="side">
      <table>
        <thead>
          <tr><th>#</th><th>관절</th><th>x</th><th>y</th><th>z</th><th>wx (m)</th><th>wy (m)</th><th>wz (m)</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <button id="save">현재 프레임 JSON 저장</button>
    </div>
  </div>
  <!-- PiP 창에 띄울 영상 (카메라 + 손 인식 오버레이 합성본) -->
  <video id="pip-video" muted playsinline></video>
  <script type="module" src="app.js"></script>
</body>
</html>
